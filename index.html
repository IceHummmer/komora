<style>
:root{--bg:#f3f2ec;--panel:#fffefa;--text:#202924;--muted:#707873;--line:#dedfd8;--green:#285342;--soft:#eaf0eb;--danger:#a23b36;--shadow:0 12px 32px #1f282414;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:#f9f8f3;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:850}.mark{width:35px;height:35px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center}.brand small{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}nav{display:grid;gap:6px;margin-top:26px}nav button{border:0;background:transparent;padding:11px 12px;border-radius:12px;text-align:left;color:#4e5752;font-weight:700}nav button.on{background:var(--green);color:#fff}.foot{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.5}.main{padding:30px 34px 60px;min-width:0}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.ey{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:850}.top h1{margin:6px 0 6px;font-size:34px;letter-spacing:-.045em}.sub{color:var(--muted)}.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:13px}.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800}.hero{background:linear-gradient(135deg,#285342,#3a6b57);color:white;padding:27px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:18px}.hero h2{font-size:30px;margin:6px 0 10px;letter-spacing:-.04em}.hero p{color:#e4efe9;max-width:720px;line-height:1.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.btn{border:0;border-radius:12px;padding:10px 14px;min-height:44px;font-weight:780}.primary{background:var(--green);color:#fff}.hero .primary{background:#fff;color:var(--green)}.soft{background:var(--soft);color:var(--green)}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.danger{background:#f9e8e6;color:var(--danger)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:18px 0}.stat,.section,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.stat{padding:17px}.stat b{font-size:26px;display:block;margin-top:8px}.muted{font-size:12px;color:var(--muted)}.section{padding:19px;margin-bottom:16px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.section h3{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:15px}.card h4{margin:0 0 5px}.row{display:flex;align-items:center;justify-content:space-between;gap:13px;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;margin-bottom:9px}.plan{border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:11px;overflow:hidden}.plan-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px}.plan-body{border-top:1px solid var(--line);padding:10px 15px 15px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ecece6}.item input{width:22px;height:22px;accent-color:var(--green)}.pill{display:inline-block;background:var(--soft);color:var(--green);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750}.empty{padding:30px;text-align:center;border:1px dashed #cfd2cb;border-radius:15px;color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#1420197a;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:20px;padding:20px;box-shadow:0 30px 80px #0004}.modal h3{margin:0 0 4px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:760;color:#4e5752}.field input,.field select{width:100%;min-height:44px;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:white}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.selector{border:1px solid var(--line);border-radius:13px;max-height:300px;overflow:auto}.selrow{display:grid;grid-template-columns:auto 1fr 80px;gap:8px;align-items:center;padding:9px 10px;border-bottom:1px solid #eee}.receipt{background:#f5f8f5;border:1px dashed #b9cabf;border-radius:14px;padding:13px;margin-top:12px}.receipt table{width:100%;border-collapse:collapse;font-size:12px}.receipt th,.receipt td{text-align:left;padding:8px 5px;border-bottom:1px solid #e0e5e1}.receipt select{max-width:220px}.status{font-size:12px;color:var(--muted);margin-top:8px}.toast{position:fixed;right:20px;bottom:20px;background:#202924;color:white;padding:11px 13px;border-radius:11px;z-index:30}
nav button .nav-icon{display:none}

  .brand{font-size:20px}

  .side nav{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0;padding:7px 7px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#fffefaf2;border-top:1px solid var(--line);box-shadow:0 -10px 30px #1f282414;backdrop-filter:blur(18px)}
  nav button{min-width:0;padding:6px 3px;border-radius:11px;text-align:center;font-size:10px;line-height:1.15;display:grid;place-items:center;gap:3px;color:#606963}
  nav button .nav-icon{display:block;font-size:19px;line-height:1}
  nav button.on{background:var(--soft);color:var(--green)}
  .main{padding:18px 12px 24px}
  .top{margin-bottom:16px;align-items:center}
  .top h1{font-size:28px;margin-top:3px}
  .top .sub{font-size:13px;line-height:1.35}
  .chip{display:none}
  .hero{padding:20px 17px;border-radius:19px;margin-bottom:13px}
  .hero h2{font-size:25px;margin-top:5px}
  .hero p{font-size:14px;margin-bottom:0}
  .hero .actions{display:grid;grid-template-columns:1fr;gap:8px}
  .hero .btn{width:100%}
  .stats{display:flex;overflow-x:auto;gap:9px;margin:13px -12px 16px;padding:0 12px 3px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .stats::-webkit-scrollbar{display:none}
  .stat{min-width:78vw;scroll-snap-align:start;padding:15px}
  .stat b{font-size:23px}
  .section{padding:14px;border-radius:16px;margin-bottom:12px}
  .section-head{align-items:flex-start;gap:10px}
  .section-head>.btn{flex:0 0 auto}
  .grid{grid-template-columns:1fr;gap:9px}
  .card{padding:14px}
  .row{padding:12px;align-items:flex-start;flex-wrap:wrap}
  .plan{border-radius:15px;margin-bottom:10px}
  .plan-head{padding:13px;align-items:flex-start;flex-direction:column}
  .plan-head .actions{width:100%;display:grid;grid-template-columns:1fr auto;gap:7px}
  .plan-body{padding:5px 12px 13px}
  .item{grid-template-columns:32px 1fr auto;gap:9px;min-height:64px;padding:12px 0}
  .item input{width:26px;height:26px}
  .item .money{font-weight:800;white-space:nowrap}
  .plan-body>.actions{display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .plan-body>.actions .muted{grid-column:1/-1;text-align:center}
  .btn{min-height:46px;padding:11px 13px}
  .modal-bg{padding:0;place-items:end center}
  .modal{width:100%;max-height:94dvh;border-radius:22px 22px 0 0;padding:19px 15px calc(15px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px #0004}
  .modal h3{font-size:21px}
  .fields{grid-template-columns:1fr;gap:10px}
  .field.full{grid-column:auto}
  .field input,.field select{min-height:48px;font-size:16px}
  .selector{max-height:44dvh}
  .selrow{grid-template-columns:30px minmax(0,1fr) 74px;min-height:57px;padding:9px}
  .selrow input[type="checkbox"]{width:24px;height:24px}
  .selrow input[type="number"]{width:74px;min-height:42px}
  .modal-actions{position:sticky;bottom:calc(-15px - env(safe-area-inset-bottom));z-index:3;margin:18px -15px calc(-15px - env(safe-area-inset-bottom));padding:11px 15px calc(11px + env(safe-area-inset-bottom));background:#fffefaed;border-top:1px solid var(--line);backdrop-filter:blur(12px)}
  .modal-actions .btn{flex:1}
  #receiptFile{width:100%;font-size:16px;margin:8px 0}
  .receipt{padding:10px;overflow:hidden}
  .receipt table,.receipt tbody,.receipt tr,.receipt td{display:block;width:100%}
  .receipt thead{display:none}
  .receipt tr{padding:10px 0;border-bottom:1px solid #e0e5e1}
  .receipt td{border:0;padding:4px 0}
  .receipt select{width:100%;max-width:none;min-height:46px;font-size:16px;margin-top:4px}
  .toast{left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));text-align:center}
}
@media(max-width:420px){
  .main{padding-left:10px;padding-right:10px}
  .section-head{flex-direction:column}
  .section-head>.btn{width:100%}
  .plan-body>.actions{grid-template-columns:1fr}
  .plan-body>.actions .muted{grid-column:auto}
  .item{grid-template-columns:30px 1fr}
  .item .money{grid-column:2;font-size:13px}
  .stat{min-width:84vw}
}

.auth-screen{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top,#e7eee8 0,#f3f2ec 42%,#f3f2ec 100%)}
.auth-card{width:min(410px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.auth-card .brand{margin-bottom:20px}
.auth-card h1{margin:0 0 8px;font-size:29px;letter-spacing:-.04em}
.auth-card p{margin:0 0 18px;color:var(--muted);line-height:1.45}
.auth-card input{width:100%;min-height:50px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:18px}
.auth-card .btn{width:100%;margin-top:12px}
.auth-error{min-height:20px;margin-top:10px;color:var(--danger);font-size:13px}
.auth-loading{min-height:100dvh;display:grid;place-items:center;color:var(--muted);font-weight:700}
.logout-mobile{display:none}
.logout-link{margin-top:10px;border:0;background:transparent;color:var(--muted);padding:5px 0;text-align:left;font-size:12px}
.sync-note{display:inline-flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#65a27f}
@media(max-width:700px){
  .logout-mobile{display:block;position:absolute;right:13px;top:11px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;min-height:32px;padding:4px 9px;font-size:12px}
  .auth-screen{padding:14px}
  .auth-card{border-radius:20px;padding:20px}
}
</style>

<body><div id="app"></div><script src="config.js"></script>
<script>
const cats0=["Овочі та фрукти","Молочні продукти","М’ясо та риба","Бакалія","Напої","Побутове","Інше"].map((name,i)=>({id:"cat-"+(i+1),name}));
const BASE_CATALOG_VERSION=1;
const baseProducts=[
  ["Банани","Овочі та фрукти","кг"],["Яблука","Овочі та фрукти","кг"],["Помідори","Овочі та фрукти","кг"],["Огірки","Овочі та фрукти","кг"],["Картопля","Овочі та фрукти","кг"],["Цибуля","Овочі та фрукти","кг"],["Морква","Овочі та фрукти","кг"],["Лимон","Овочі та фрукти","шт"],
  ["Молоко","Молочні продукти","шт"],["Сир","Молочні продукти","шт"],["Йогурт","Молочні продукти","шт"],["Масло","Молочні продукти","шт"],["Яйця","Молочні продукти","упак."],["Сметана","Молочні продукти","шт"],["Вершки","Молочні продукти","шт"],["Кефір","Молочні продукти","шт"],
  ["М'ясо","М’ясо та риба","шт"],["Курятина","М’ясо та риба","шт"],["Фарш","М’ясо та риба","шт"],["Ковбаса","М’ясо та риба","шт"],["Шинка","М’ясо та риба","шт"],["Риба","М’ясо та риба","шт"],["Бекон","М’ясо та риба","шт"],
  ["Хліб","Бакалія","шт"],["Булочки","Бакалія","шт"],["Шоколад","Бакалія","шт"],["Рис","Бакалія","упак."],["Макарони","Бакалія","упак."],["Вівсянка","Бакалія","упак."],["Борошно","Бакалія","упак."],["Цукор","Бакалія","упак."],["Олія","Бакалія","шт"],["Кава","Бакалія","упак."],["Чай","Бакалія","упак."],
  ["Вода","Напої","шт"],["Сік","Напої","шт"],["Газована вода","Напої","шт"],
  ["Туалетний папір","Побутове","упак."],["Засіб для миття посуду","Побутове","шт"],["Пакети для сміття","Побутове","упак."],
  ["Піца","Інше","шт"],["Лазанья","Інше","шт"]
];
const LEGACY_KEY="komora-v2",AUTH_KEY="komora-auth-token",API=()=>String(window.KOMORA_API_URL||"").replace(/\/$/,"");
let state=null,view="dashboard",modal=null,receipt=null,authToken=localStorage.getItem(AUTH_KEY)||"",authLoading=true,saveQueue=Promise.resolve();
function normalizeName(s){return String(s||"").toLocaleLowerCase("uk-UA").replace(/[’'\u0060]/g,"").replace(/\s+/g," ").trim()}
function ensureBaseCatalog(s){
  s.categories=Array.isArray(s.categories)?s.categories:[];
  s.products=Array.isArray(s.products)?s.products:[];
  s.stores=Array.isArray(s.stores)?s.stores:[];
  s.plans=Array.isArray(s.plans)?s.plans:[];
  s.purchases=Array.isArray(s.purchases)?s.purchases:[];
  for(const baseCat of cats0){
    if(!s.categories.some(c=>c.name===baseCat.name)) s.categories.push({...baseCat});
  }
  if((s.baseCatalogVersion||0)<BASE_CATALOG_VERSION){
    const existing=new Set(s.products.map(p=>normalizeName(p.name)));
    for(const [name,categoryName,unit] of baseProducts){
      if(existing.has(normalizeName(name))) continue;
      const category=s.categories.find(c=>c.name===categoryName);
      s.products.push({id:"base-"+normalizeName(name).replace(/[^a-zа-яіїєґ0-9]+/giu,"-")+"-"+Math.random().toString(16).slice(2,8),name,categoryId:category?.id||null,unit,preferredStoreId:null,prices:[],isBase:true});
      existing.add(normalizeName(name));
    }
    s.baseCatalogVersion=BASE_CATALOG_VERSION;
  }
  return s;
}
function freshState(){return ensureBaseCatalog({categories:cats0.map(x=>({...x})),stores:[],products:[],plans:[],purchases:[]})}
function legacyState(){try{const raw=localStorage.getItem(LEGACY_KEY);return raw?ensureBaseCatalog(JSON.parse(raw)):null}catch{return null}}
async function apiFetch(path,options={}){
  const headers={...(options.headers||{})};
  if(authToken) headers.Authorization="Bearer "+authToken;
  const r=await fetch(API()+path,{...options,headers});
  if(r.status===401){authToken="";localStorage.removeItem(AUTH_KEY);state=null}
  return r;
}
async function persistStateNow(snapshot=state){
  if(!authToken||!snapshot)return;
  const r=await apiFetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:snapshot})});
  if(!r.ok){let j={};try{j=await r.json()}catch{};throw new Error(j.error||"Не вдалося зберегти дані")}
}
function save(){
  if(!state||!authToken)return;
  const snapshot=JSON.parse(JSON.stringify(state));
  saveQueue=saveQueue.then(()=>persistStateNow(snapshot)).catch(e=>toast(e.message||"Помилка синхронізації"));
}
async function loadRemoteState(){
  authLoading=true;render();
  try{
    const r=await apiFetch("/api/state");
    if(r.status===401){authLoading=false;render();return}
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||"Не вдалося завантажити дані");
    if(j.state){
      state=ensureBaseCatalog(j.state);
      await persistStateNow(JSON.parse(JSON.stringify(state)));
    }else{
      state=legacyState()||freshState();
      await persistStateNow(JSON.parse(JSON.stringify(state)));
      localStorage.removeItem(LEGACY_KEY);
    }
  }catch(e){
    authToken="";localStorage.removeItem(AUTH_KEY);state=null;
    sessionStorage.setItem("komora-login-error",e.message||"Помилка з'єднання");
  }
  authLoading=false;render();
}
async function boot(){if(authToken)await loadRemoteState();else{authLoading=false;render()}}
const id=p=>p+"-"+Date.now()+"-"+Math.random().toString(16).slice(2),esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])),eur=n=>Number.isFinite(+n)?new Intl.NumberFormat("uk-UA",{style:"currency",currency:"EUR"}).format(+n):"—";
const storeName=x=>state.stores.find(s=>s.id===x)?.name||"Не вибрано",catName=x=>state.categories.find(c=>c.id===x)?.name||"Без категорії",prod=x=>state.products.find(p=>p.id===x);
function latest(pid,sid){let h=[...(prod(pid)?.prices||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));return h.find(x=>x.storeId===sid)||h[0]||null}
function spent(){let n=new Date;return state.purchases.filter(p=>{let d=new Date(p.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).reduce((a,p)=>a+p.total,0)}
function toast(t){let e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)}
function head(title,sub){return '<div class="top"><div><div class="ey">Моя комора</div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="chip"><div class="av">АК</div><span>Особистий облік</span></div></div>'}
function nav(){return [["dashboard","🛒","План"],["products","🥫","Продукти"],["stores","🏪","Магазини"],["history","🧾","Історія"],["categories","▦","Категорії"]].map(x=>'<button data-view="'+x[0]+'" class="'+(view===x[0]?"on":"")+'"><span class="nav-icon">'+x[1]+'</span><span>'+x[2]+'</span></button>').join("")}
function loginHtml(){let err=sessionStorage.getItem("komora-login-error")||"";sessionStorage.removeItem("komora-login-error");return '<div class="auth-screen"><div class="auth-card"><div class="brand"><div class="mark">К</div><div>комора<small>особистий простір</small></div></div><h1>Вхід до Комори</h1><p>Введіть пароль. Після входу продукти, плани, ціни та історія завантажуються з сервера.</p><form id="loginForm"><input name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Пароль" required autofocus><button class="btn primary">Увійти</button><div class="auth-error" id="authError">'+esc(err)+'</div></form></div></div>'}
async function loginSubmit(e){e.preventDefault();let form=e.target,btn=form.querySelector("button"),err=document.getElementById("authError");btn.disabled=true;err.textContent="";try{let r=await fetch(API()+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:new FormData(form).get("password")})}),j=await r.json();if(!r.ok)throw new Error(j.error||"Помилка входу");authToken=j.token;localStorage.setItem(AUTH_KEY,authToken);await loadRemoteState()}catch(x){err.textContent=x.message||"Помилка входу";btn.disabled=false}}
function logout(){authToken="";state=null;localStorage.removeItem(AUTH_KEY);render()}
function render(){if(authLoading){app.innerHTML='<div class="auth-loading">Завантаження…</div>';return}if(!authToken||!state){app.innerHTML=loginHtml();let lf=document.getElementById("loginForm");if(lf)lf.onsubmit=loginSubmit;return}app.innerHTML='<div class="shell"><aside class="side"><div class="brand"><div class="mark">К</div><div>комора<small>особистий простір</small></div></div><button class="logout-mobile" data-logout>Вийти</button><nav>'+nav()+'</nav><div class="foot"><span class="sync-note"><span class="sync-dot"></span> Дані на сервері</span><br>EUR · Українська<button class="logout-link" data-logout>Вийти</button></div></aside><main class="main">'+page()+'</main></div>'+(modal?modalHtml():"");bind()}
function page(){return view==="products"?productsPage():view==="stores"?storesPage():view==="history"?historyPage():view==="categories"?categoriesPage():dashboard()}
function dashboard(){let active=state.plans.filter(p=>p.status==="active");return head("План закупівлі","Сплануйте покупки. Відмічайте знайдене. Звіряйте з чеком.")+
'<section class="hero"><div class="ey" style="color:#d8e8df">Від плану до покупки</div><h2>Один список. Усі покупки.</h2><p>Оберіть продукти, відмічайте знайдене у магазині, завантажте чек — AI розпізнає різні мови, перекладе позиції українською і запропонує відповідності та фактичні ціни.</p><div class="actions"><button class="btn primary" data-open="plan">＋ Новий план</button><button class="btn ghost" data-view="products">Базовий перелік</button></div></section>'+
'<div class="stats"><div class="stat"><span class="muted">Витрати цього місяця</span><b>'+eur(spent())+'</b><span class="muted">Лише підтверджені покупки</span></div><div class="stat"><span class="muted">Активні плани</span><b>'+active.length+'</b><span class="muted">Готові до закупівлі</span></div><div class="stat"><span class="muted">Базовий перелік</span><b>'+state.products.length+'</b><span class="muted">'+state.stores.length+' магазинів · '+state.categories.length+' категорій</span></div></div>'+
'<section class="section"><div class="section-head"><div><h3>Мої списки</h3><div class="muted">Активні плани закупівель</div></div><button class="btn soft" data-open="plan">＋ Створити план</button></div>'+(active.length?active.map(planCard).join(""):'<div class="empty">Додайте магазин і продукти, а потім створіть перший план.</div>')+'</section>'}
function planCard(p){let checked=p.items.filter(i=>i.checked).length,est=p.items.reduce((s,i)=>{let q=latest(i.productId,p.storeId);return s+(q?q.price*i.qty:0)},0);return '<div class="plan"><div class="plan-head"><div><h4 style="margin:0">'+esc(p.name)+'</h4><div class="muted">'+esc(storeName(p.storeId))+' · '+p.items.length+' позицій · орієнтовно '+eur(est)+'</div></div><div class="actions" style="margin:0"><button class="btn soft" data-toggle="'+p.id+'">'+(p.open?"Згорнути":"Відкрити")+'</button><button class="btn danger" data-delplan="'+p.id+'">Видалити</button></div></div>'+(p.open?'<div class="plan-body">'+p.items.map(i=>{let pr=prod(i.productId),lp=latest(i.productId,p.storeId);return '<div class="item"><input type="checkbox" data-check="'+p.id+':'+i.productId+'" '+(i.checked?"checked":"")+'><div><b>'+esc(pr?.name||"Видалено")+'</b><div class="muted">'+i.qty+' '+esc(pr?.unit||"шт")+(lp?' · '+(lp.storeId===p.storeId?"ціна цього магазину":"остання ціна"):"")+'</div></div><div class="money">'+(lp?eur(lp.price*i.qty):"—")+'</div></div>'}).join("")+'<div class="actions"><button class="btn primary" data-receipt="'+p.id+'">🧾 Завантажити чек</button><button class="btn ghost" data-manual="'+p.id+'">Внести ціни вручну</button><span class="muted">Відмічено '+checked+' з '+p.items.length+'</span></div></div>':"")+'</div>'}
function productsPage(){return head("Продукти","Базовий перелік для майбутніх закупівель.")+'<section class="section"><div class="section-head"><div><h3>Каталог</h3><div class="muted">Остання ціна спочатку береться з обраного магазину.</div></div><button class="btn primary" data-open="product">＋ Додати продукт</button></div>'+(state.products.length?'<div class="grid">'+state.products.map(p=>{let lp=latest(p.id,p.preferredStoreId);return '<div class="card"><h4>'+esc(p.name)+'</h4><div class="muted">'+esc(catName(p.categoryId))+' · '+esc(p.unit)+'</div><div style="font-size:20px;font-weight:850;margin:14px 0 5px">'+(lp?eur(lp.price):"—")+'</div><span class="pill">'+esc(p.preferredStoreId?storeName(p.preferredStoreId):"Без магазину")+'</span><div class="actions"><button class="btn danger" data-delprod="'+p.id+'">Видалити</button></div></div>'}).join("")+'</div>':'<div class="empty">Каталог порожній.</div>')+'</section>'}
function storesPage(){return head("Магазини","Довідник магазинів.")+'<section class="section"><div class="section-head"><h3>Мої магазини</h3><button class="btn primary" data-open="store">＋ Додати магазин</button></div>'+(state.stores.length?'<div class="grid">'+state.stores.map(s=>'<div class="card"><h4>'+esc(s.name)+'</h4><div class="muted">'+esc(s.note||"Без примітки")+'</div><div class="actions"><button class="btn danger" data-delstore="'+s.id+'">Видалити</button></div></div>').join("")+'</div>':'<div class="empty">Ще немає магазинів.</div>')+'</section>'}
function categoriesPage(){return head("Категорії","Групуйте продукти зручним способом.")+'<section class="section"><div class="section-head"><h3>Категорії</h3><button class="btn primary" data-open="category">＋ Додати категорію</button></div>'+state.categories.map(c=>'<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted">'+state.products.filter(p=>p.categoryId===c.id).length+' продуктів</div></div><button class="btn danger" data-delcat="'+c.id+'">Видалити</button></div>').join("")+'</section>'}
function historyPage(){return head("Історія","Підтверджені покупки та фактичні ціни.")+'<section class="section"><div class="section-head"><h3>Покупки</h3></div>'+(state.purchases.length?state.purchases.map(p=>'<div class="row"><div><b>'+new Date(p.date).toLocaleDateString("uk-UA")+' · '+esc(storeName(p.storeId))+'</b><div class="muted">'+p.items.length+' позицій</div></div><b>'+eur(p.total)+'</b></div>').join(""):'<div class="empty">Після першої підтвердженої покупки вона з’явиться тут.</div>')+'</section>'}
function modalHtml(){if(modal.type==="product")return wrap("Новий продукт",'<div class="fields"><div class="field full"><label>Назва</label><input name="name" required></div><div class="field"><label>Категорія</label><select name="category">'+state.categories.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join("")+'</select></div><div class="field"><label>Одиниця</label><input name="unit" value="шт"></div><div class="field full"><label>Найчастіший магазин</label><select name="store"><option value="">Не вибрано</option>'+state.stores.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("")+'</select></div></div>');if(modal.type==="store")return wrap("Новий магазин",'<div class="fields"><div class="field full"><label>Назва</label><input name="name" required></div><div class="field full"><label>Примітка</label><input name="note"></div></div>');if(modal.type==="category")return wrap("Нова категорія",'<div class="field"><label>Назва</label><input name="name" required></div>');if(modal.type==="plan")return wrap("Новий план",'<div class="fields"><div class="field"><label>Назва</label><input name="name" value="План закупівлі"></div><div class="field"><label>Магазин</label><select name="store" required><option value="">Оберіть</option>'+state.stores.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("")+'</select></div><div class="field full"><label>Продукти</label><div class="selector">'+state.products.map(p=>'<div class="selrow"><input type="checkbox" name="p-'+p.id+'"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(catName(p.categoryId))+'</div></div><input type="number" min=".1" step=".1" name="q-'+p.id+'" value="1"></div>').join("")+'</div></div></div>');if(modal.type==="manual")return manualModal();if(modal.type==="receipt")return receiptModal();return ""}
function wrap(title,body){return '<div class="modal-bg" data-close><div class="modal" onclick="event.stopPropagation()"><h3>'+title+'</h3><form id="form">'+body+'<div class="modal-actions"><button type="button" class="btn ghost" data-close>Скасувати</button><button class="btn primary">Зберегти</button></div></form></div></div>'}
function manualModal(){let p=state.plans.find(x=>x.id===modal.planId),items=p.items.filter(i=>i.checked);return wrap("Фактичні ціни",'<div class="field"><label>Дата</label><input type="date" name="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div style="margin-top:12px">'+items.map(i=>{let pr=prod(i.productId),lp=latest(i.productId,p.storeId);return '<div class="row"><div><b>'+esc(pr.name)+'</b><div class="muted">'+i.qty+' '+esc(pr.unit)+'</div></div><input style="width:115px;padding:9px;border:1px solid var(--line);border-radius:10px" type="number" step=".01" min="0" name="price-'+i.productId+'" value="'+(lp?.price??"")+'" required></div>'}).join("")+'</div>')}
function receiptModal(){let p=state.plans.find(x=>x.id===modal.planId);if(!receipt)return '<div class="modal-bg" data-close><div class="modal" onclick="event.stopPropagation()"><h3>AI-розпізнавання чека</h3><p class="muted">Фото JPG/PNG/WEBP або PDF. Чек може бути фінською, шведською, англійською або змішаним — назви будуть приведені до української.</p><input id="receiptFile" type="file" accept="image/*,application/pdf"><div class="status" id="aiStatus">'+(API()?"Готово до завантаження.":"Backend URL ще не налаштовано.")+'</div><div class="modal-actions"><button class="btn ghost" data-close>Скасувати</button><button class="btn primary" type="button" id="scanBtn">Розпізнати чек</button></div></div></div>';let options='<option value="">Не зіставляти</option>'+p.items.map(i=>'<option value="'+i.productId+'">'+esc(prod(i.productId)?.name||"")+'</option>').join("");return '<div class="modal-bg" data-close><div class="modal" onclick="event.stopPropagation()"><h3>Перевірте результат</h3><div class="muted">'+esc(receipt.store_name||"Магазин")+(receipt.receipt_date?" · "+esc(receipt.receipt_date):"")+(receipt.total!=null?" · "+eur(receipt.total):"")+'</div><div class="receipt"><table><thead><tr><th>Чек</th><th>Ціна</th><th>Позиція плану</th></tr></thead><tbody>'+receipt.items.map((x,i)=>'<tr><td><b>'+esc(x.ukrainian_name)+'</b><div class="muted">'+esc(x.raw_name)+'</div></td><td>'+eur(x.unit_price??x.total_price)+'</td><td><select data-match="'+i+'">'+options.replace('value="'+(x.matched_product_id||"")+'"','value="'+(x.matched_product_id||"")+'" selected')+'</select></td></tr>').join("")+'</tbody></table></div>'+(receipt.warnings_uk?.length?'<div class="receipt">'+receipt.warnings_uk.map(esc).join("<br>")+'</div>':"")+'<div class="modal-actions"><button class="btn ghost" data-close>Скасувати</button><button class="btn primary" id="confirmReceipt">Підтвердити покупку</button></div></div></div>'}
function bind(){document.querySelectorAll("[data-logout]").forEach(b=>b.onclick=logout);document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{view=b.dataset.view;modal=null;receipt=null;render()});document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{modal={type:b.dataset.open};render()});document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{modal=null;receipt=null;render()});document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let p=state.plans.find(x=>x.id===b.dataset.toggle);p.open=!p.open;save();render()});document.querySelectorAll("[data-check]").forEach(c=>c.onchange=()=>{let [a,b]=c.dataset.check.split(":");state.plans.find(x=>x.id===a).items.find(x=>x.productId===b).checked=c.checked;save();render()});document.querySelectorAll("[data-receipt]").forEach(b=>b.onclick=()=>{modal={type:"receipt",planId:b.dataset.receipt};receipt=null;render()});document.querySelectorAll("[data-manual]").forEach(b=>b.onclick=()=>{modal={type:"manual",planId:b.dataset.manual};render()});document.querySelectorAll("[data-delplan]").forEach(b=>b.onclick=()=>{if(confirm("Видалити план?")){state.plans=state.plans.filter(x=>x.id!==b.dataset.delplan);save();render()}});document.querySelectorAll("[data-delprod]").forEach(b=>b.onclick=()=>{if(confirm("Видалити продукт?")){state.products=state.products.filter(x=>x.id!==b.dataset.delprod);save();render()}});document.querySelectorAll("[data-delstore]").forEach(b=>b.onclick=()=>{if(confirm("Видалити магазин?")){state.stores=state.stores.filter(x=>x.id!==b.dataset.delstore);save();render()}});document.querySelectorAll("[data-delcat]").forEach(b=>b.onclick=()=>{if(state.products.some(p=>p.categoryId===b.dataset.delcat))return alert("У категорії є продукти.");state.categories=state.categories.filter(x=>x.id!==b.dataset.delcat);save();render()});let f=document.getElementById("form");if(f)f.onsubmit=submit;let scan=document.getElementById("scanBtn");if(scan)scan.onclick=scanReceipt;let conf=document.getElementById("confirmReceipt");if(conf)conf.onclick=confirmReceipt}
function submit(e){e.preventDefault();let f=new FormData(e.target);if(modal.type==="product")state.products.push({id:id("prod"),name:f.get("name").trim(),categoryId:f.get("category"),unit:f.get("unit").trim()||"шт",preferredStoreId:f.get("store")||null,prices:[]});if(modal.type==="store")state.stores.push({id:id("store"),name:f.get("name").trim(),note:f.get("note").trim()});if(modal.type==="category")state.categories.push({id:id("cat"),name:f.get("name").trim()});if(modal.type==="plan"){let items=state.products.filter(p=>f.get("p-"+p.id)==="on").map(p=>({productId:p.id,qty:+f.get("q-"+p.id)||1,checked:false}));if(!items.length)return alert("Оберіть хоча б один продукт.");state.plans.unshift({id:id("plan"),name:f.get("name").trim(),storeId:f.get("store"),createdAt:new Date().toISOString(),status:"active",open:true,items})}if(modal.type==="manual"){let p=state.plans.find(x=>x.id===modal.planId),date=f.get("date"),items=p.items.filter(i=>i.checked).map(i=>{let price=+f.get("price-"+i.productId);prod(i.productId).prices.push({storeId:p.storeId,price,date:new Date(date).toISOString()});return {productId:i.productId,qty:i.qty,price,subtotal:price*i.qty}});finishPurchase(p,items,new Date(date).toISOString())}save();modal=null;toast("Збережено");render()}
function fileData(file){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Не вдалося прочитати файл"));r.readAsDataURL(file)})}
async function prepareReceiptFile(file){
  if(file.type==="application/pdf"||file.name.toLowerCase().endsWith(".pdf")){
    return {fileName:file.name,mimeType:"application/pdf",dataUrl:await fileData(file)};
  }
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{
      const el=new Image();
      el.onload=()=>res(el);
      el.onerror=()=>rej(new Error("Не вдалося відкрити зображення"));
      el.src=url;
    });
    const maxSide=1800;
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d",{alpha:false});
    ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);
    return {fileName:file.name.replace(/\.[^.]+$/,"")+".jpg",mimeType:"image/jpeg",dataUrl:canvas.toDataURL("image/jpeg",0.84)};
  } finally { URL.revokeObjectURL(url); }
}
async function scanReceipt(){if(!API())return alert("Backend URL ще не налаштовано.");let file=document.getElementById("receiptFile").files[0];if(!file)return alert("Оберіть файл чека.");let st=document.getElementById("aiStatus"),btn=document.getElementById("scanBtn");btn.disabled=true;st.textContent="Готую файл…";try{let p=state.plans.find(x=>x.id===modal.planId),prepared=await prepareReceiptFile(file),plannedItems=p.items.map(i=>({productId:i.productId,name:prod(i.productId)?.name||"",qty:i.qty,unit:prod(i.productId)?.unit||"шт",checked:i.checked}));st.textContent="Розпізнаю чек…";let r=await apiFetch("/api/receipt",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fileName:prepared.fileName,mimeType:prepared.mimeType,dataUrl:prepared.dataUrl,plannedItems})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||"Помилка API");receipt=j;render()}catch(e){st=document.getElementById("aiStatus");if(st){let msg=String(e?.message||e||"");if(/load failed|failed to fetch|network/i.test(msg))msg="Не вдалося зв’язатися з сервером. Перевірте інтернет і спробуйте ще раз.";st.textContent="Помилка: "+msg}btn=document.getElementById("scanBtn");if(btn)btn.disabled=false}}
function confirmReceipt(){let p=state.plans.find(x=>x.id===modal.planId),date=receipt.receipt_date?new Date(receipt.receipt_date).toISOString():new Date().toISOString(),items=[];document.querySelectorAll("[data-match]").forEach(s=>{if(!s.value)return;let x=receipt.items[+s.dataset.match],pi=p.items.find(i=>i.productId===s.value);if(!pi)return;let price=x.unit_price!=null?+x.unit_price:(x.total_price!=null?+x.total_price/(x.quantity||1):null);if(price==null)return;let pr=prod(s.value);pr.prices=pr.prices||[];pr.prices.push({storeId:p.storeId,price,date});pi.checked=true;items.push({productId:s.value,qty:pi.qty,price,subtotal:price*pi.qty})});if(!items.length)return alert("Оберіть хоча б одну відповідність.");finishPurchase(p,items,date);save();modal=null;receipt=null;toast("Покупку та фактичні ціни збережено");render()}
function finishPurchase(p,items,date){let total=items.reduce((s,i)=>s+i.subtotal,0);state.purchases.unshift({id:id("buy"),planId:p.id,storeId:p.storeId,date,items,total});p.status="completed"}
boot();
</script></body></html>
